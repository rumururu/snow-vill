# Snow Village store settings — source for the App Store / Google Play listings
# (written by mobile/tools/store/listing.py). Limits: Play title ≤30, short ≤80, full ≤4000;
# App Store name/subtitle ≤30, keywords ≤100 bytes-ish (count characters), promo ≤170.
app:
  name: snow-vill
  display_name: "Snow Village"
  package_name: com.mkideabox.snowvillage
  bundle_id: com.mkideabox.snowvillage
  asc_app_id: "6832823869"

checklist:
  uses_google_ads: false
  uses_third_party_ads: false
  analytics_sdk: false
  requires_login: false          # no accounts; a random install id + secrets on the device
  target_stores: {google_play: true, app_store: true}
  app_type: social               # friends share one village by link
  has_in_app_purchase: true      # 4 consumables, docs/10-store-iap-setup.md
  user_generated_content: true   # village/house names, one-line message, one photo; report + delete flows exist
  permissions:
    photos: picker only          # system photo picker, one photo, EXIF removed, 512px
    camera: false
    location: false
    microphone: false
    contacts: false

urls:
  marketing: https://snow.mkideabox.com/
  support: https://snow.mkideabox.com/privacy/      # page carries the contact address (mkideabox.feedback@gmail.com)
  privacy: https://snow.mkideabox.com/privacy/
  contact_email: mkideabox.feedback@gmail.com

copyright: "2026 mkideabox"
category: {app_store: SOCIAL_NETWORKING, app_store_secondary: LIFESTYLE, google_play: SOCIAL}

localizations:
  ko:
    google_play_locale: ko-KR
    app_store_locale: ko
    title: "Snow Village - 친구와 짓는 겨울 마을"
    name: "Snow Village"
    subtitle: "친구와 함께 짓는 겨울 마을"
    short_description: "링크 하나로 친구를 초대해 집을 한 채씩 짓는 겨울 마을. 집을 누르면 사진 액자가 열려요."
    keywords: "크리스마스,겨울,마을,친구,초대,사진,추억,연말,눈,모임,우정,선물,아이소메트릭"
    promotional_text: "올해 연말엔 친구들과 작은 겨울 마을을 지어 보세요. 집마다 사진 한 장, 한마디 한 줄."
    full_description: |
      Snow Village는 친구들과 함께 짓는 작은 겨울 마을이에요.

      마을을 만들고 링크를 보내면, 친구가 링크를 열어 빈 집터에 자기 집을 한 채 지어요. 집 모양과 문 방향을 고르고, 한마디와 사진 한 장을 남길 수 있어요. 마을에서 집을 누르면 그 친구의 사진 액자가 열려요.

      ■ 이런 마을이에요
      • 가운데 성당 광장을 두고 동네가 둘레에 이어져요
      • 통나무집, 빵집, 풍차집, 진저브레드 하우스 등 9가지 집, 4가지 방향
      • 동네마다 아이스링크, 산타의 집, 루돌프 동상 같은 시설이 생겨요
      • 친구가 18명을 넘으면 마을 하늘에 오로라가 떠요

      ■ 처음엔 무료로 6채
      마을은 무료로 6채까지 지을 수 있어요. 친구가 더 많으면 원하는 동네를 골라 집터를 3곳씩 넓힐 수 있어요(최대 60채). 넓히기는 앱 안 구매로 하고, 넓힌 마을은 웹에서도 똑같이 보여요.

      ■ 사진은 조용히
      • 회원가입이 없어요. 이름·이메일·전화번호를 받지 않아요
      • 사진은 비공개 저장소에 두고, 집을 눌렀을 때만 잠깐 유효한 주소로 보여 줘요
      • 공유 카드에는 사진·닉네임이 들어가지 않아요
      • 사진의 위치 정보(EXIF)는 올릴 때 지워요
      • 내 집은 언제든 비울 수 있고, 마을을 만든 사람은 마을 전체를 지울 수 있어요
      • 부적절한 집은 신고할 수 있어요

      링크를 가진 사람은 마을을 볼 수 있으니 믿을 수 있는 친구에게만 보내 주세요.
    review_notes: |
      Sign-in is optional: everything works without an account. Sign in with Apple or Google (account button at the
      top right of the home screen) keeps your villages across devices, and lets an owner make a village private
      (⋮ → 비공개 마을; others then send a join request the owner approves under ⋮ → 멤버). Account deletion:
      account button → 계정 삭제. Create a village on the home screen (새 마을 만들기), then move into a lot. To see the in-app purchase:
      open the village → top-right menu (⋮) → 마을 넓히기 (Grow the village) → pick a district → buy.
      Each purchase is consumable and opens 3 more lots in the chosen district. Content: user names, a one-line
      message and one photo per house; report (집 신고) and delete (내 집 비우기 / 마을 삭제) are in the house and village menus.
  en:
    google_play_locale: en-US
    app_store_locale: en-US
    title: "Snow Village: Build Together"
    name: "Snow Village: Build Together"   # "Snow Village" alone is taken on the App Store (en-US) by another developer
    subtitle: "A winter village with friends"
    short_description: "Invite friends by link; each builds a house. Tap one to see their photo."
    keywords: "christmas,winter,village,friends,invite,photo,memories,holiday,snow,group,gift,isometric"
    promotional_text: "Build a small winter village with your friends this holiday season — one photo and one line per house."
    full_description: |
      Snow Village is a small winter village you build with friends.

      Create a village and share the link. Each friend opens it and builds a house on an empty lot, picks its style and door direction, and leaves a short message and one photo. Tap a house in the village to open that friend's photo frame.

      ■ The village
      • A cathedral plaza in the middle with districts around it
      • 9 house types — log cabin, bakery, windmill, gingerbread and more — in 4 directions
      • Districts bring an ice rink, Santa's house, a Rudolph statue and other sights
      • With 18 or more houses the aurora appears

      ■ Free for 6 houses
      A village holds 6 houses for free. For more friends, pick a district and open 3 more lots at a time (up to 60) with an in-app purchase. The bigger village shows the same on the web.

      ■ Quiet about photos
      • No sign-up; no name, e-mail or phone number
      • Photos live in private storage and are only shown through a short-lived link when a house is tapped
      • Share cards never include photos or nicknames
      • Location data (EXIF) is removed on upload
      • Clear your house at any time; the village creator can delete the whole village
      • Report a house that is not okay

      Anyone with the link can see the village, so share it with people you trust.
  ja:
    google_play_locale: ja-JP
    app_store_locale: ja
    title: "Snow Village - 友だちと作る冬の村"
    name: "Snow Village: みんなの冬の村"
    subtitle: "友だちと一緒に作る冬の村"
    short_description: "リンクで友だちを招待して、一人一軒ずつ家を建てる冬の村。家をタップすると写真フレームが開きます。"
    keywords: "クリスマス,冬,村,友だち,招待,写真,思い出,年末,雪,グループ,プレゼント,アイソメトリック"
    promotional_text: "今年の年末は、友だちと小さな冬の村を作ってみませんか。家ごとに写真1枚と、ひとこと。"
    full_description: |
      Snow Villageは、友だちと一緒に作る小さな冬の村です。

      村を作ってリンクを送ると、友だちがリンクを開いて空いている区画に自分の家を一軒建てます。家の形とドアの向きを選び、ひとことと写真1枚を残せます。村で家をタップすると、その友だちの写真フレームが開きます。

      ■ こんな村です
      • 真ん中の大聖堂広場を囲むように通りが広がります
      • ログハウス、パン屋、風車の家、ジンジャーブレッドの家など9種類の家、4つの向き
      • 通りごとにスケートリンク、サンタの家、ルドルフ像などの名所ができます
      • 家が18軒以上になると、村の空にオーロラが現れます

      ■ 最初の6軒は無料
      村には無料で6軒まで家を建てられます。友だちがもっと多いときは、好きな通りを選んで区画を3つずつ開けます（最大60軒）。拡張はアプリ内課金で行い、広げた村はウェブでも同じように表示されます。

      ■ 写真はそっと
      • 会員登録はありません。名前・メールアドレス・電話番号は受け取りません
      • 写真は非公開のストレージに保存され、家をタップしたときだけ短時間有効なリンクで表示されます
      • 共有カードに写真やニックネームは入りません
      • 写真の位置情報（EXIF）はアップロード時に削除します
      • 自分の家はいつでも空けられ、村を作った人は村全体を削除できます
      • 不適切な家は通報できます

      リンクを知っている人は誰でも村を見られるので、信頼できる友だちにだけ送ってください。
  zh:
    google_play_locale: zh-CN
    app_store_locale: zh-Hans
    title: "Snow Village - 和好友一起建冬日小镇"
    name: "Snow Village: 好友冬日小镇"
    subtitle: "和好友一起建造的冬日小镇"
    short_description: "用一个链接邀请好友，每人盖一栋房子。点一下房子，就能打开好友的相框。"
    keywords: "圣诞,冬天,小镇,村庄,好友,邀请,照片,回忆,年末,下雪,聚会,礼物,等距"
    promotional_text: "今年年末，和好友一起建一座小小的冬日小镇吧。每栋房子一张照片、一句话。"
    full_description: |
      Snow Village 是一座和好友一起建造的冬日小镇。

      创建小镇并分享链接，好友打开链接后，就能在空地上盖一栋自己的房子：选择房子样式和门的朝向，留下一句话和一张照片。在小镇里点一下房子，就会打开那位好友的相框。

      ■ 小镇是这样的
      • 中央是大教堂广场，各条街巷环绕四周
      • 小木屋、面包店、风车屋、姜饼屋等 9 种房子，4 种朝向
      • 每条街巷都会带来冰场、圣诞老人之家、鲁道夫雕像等地标
      • 好友超过 18 位时，小镇上空会出现极光

      ■ 前 6 栋免费
      每座小镇可免费建 6 栋房子。好友更多时，可以选择一条街巷，每次再开放 3 块空地（最多 60 栋）。扩建通过应用内购买完成，扩建后的小镇在网页上也会同样显示。

      ■ 照片低调保管
      • 无需注册，不收集姓名、电子邮箱或电话号码
      • 照片存放在私密存储中，只有点开房子时才通过短时有效的链接显示
      • 分享卡片中不会包含照片或昵称
      • 上传时会删除照片的位置信息（EXIF）
      • 随时可以清空自己的房子；小镇创建者可以删除整座小镇
      • 可以举报不当的房子

      拥有链接的人都能看到小镇，所以请只分享给你信任的人。
  es:
    google_play_locale: es-419
    app_store_locale: es-MX
    title: "Snow Village: Entre amigos"
    name: "Snow Village: Entre amigos"
    subtitle: "Un pueblo invernal con amigos"
    short_description: "Invita amigos con un enlace: cada uno hace su casa. Toca una para ver su foto."
    keywords: "navidad,invierno,pueblo,amigos,invitar,foto,recuerdos,fiestas,nieve,grupo,regalo,isométrico"
    promotional_text: "Construye un pequeño pueblo invernal con tus amigos estas fiestas: una foto y una frase por casa."
    full_description: |
      Snow Village es un pequeño pueblo invernal que construyes con tus amigos.

      Crea un pueblo y comparte el enlace. Cada amigo lo abre, construye una casa en un lote libre, elige su estilo y la dirección de la puerta, y deja un mensaje corto y una foto. Toca una casa del pueblo para abrir el marco de fotos de ese amigo.

      ■ El pueblo
      • Una plaza con catedral en el centro y calles alrededor
      • 9 tipos de casa (cabaña de troncos, panadería, molino, casa de jengibre y más) en 4 direcciones
      • Las calles traen una pista de hielo, la casa de Papá Noel, una estatua de Rodolfo y otros lugares
      • Con 18 casas o más aparece la aurora

      ■ Gratis para 6 casas
      Un pueblo admite 6 casas gratis. Si tienes más amigos, elige una calle y abre 3 lotes más cada vez (hasta 60) con una compra dentro de la app. El pueblo ampliado se ve igual en la web.

      ■ Discreto con las fotos
      • Sin registro: no pedimos nombre, correo ni número de teléfono
      • Las fotos se guardan en un almacenamiento privado y solo se muestran mediante un enlace temporal al tocar una casa
      • Las tarjetas para compartir nunca incluyen fotos ni apodos
      • Los datos de ubicación (EXIF) se eliminan al subir la foto
      • Vacía tu casa cuando quieras; quien creó el pueblo puede eliminarlo por completo
      • Puedes denunciar una casa inapropiada

      Cualquiera con el enlace puede ver el pueblo, así que compártelo solo con personas de confianza.
  fr:
    google_play_locale: fr-FR
    app_store_locale: fr-FR
    title: "Snow Village : entre amis"
    name: "Snow Village : entre amis"
    subtitle: "Un village d'hiver entre amis"
    short_description: "Invite tes amis par lien, une maison chacun. Touches-en une pour voir la photo."
    keywords: "noël,hiver,village,amis,invitation,photo,souvenirs,fêtes,neige,groupe,cadeau,isométrique"
    promotional_text: "Construis un petit village d'hiver avec tes amis pour les fêtes : une photo et un mot par maison."
    full_description: |
      Snow Village est un petit village d'hiver que l'on construit entre amis.

      Crée un village et partage le lien. Chaque ami l'ouvre, construit une maison sur un terrain libre, choisit son style et l'orientation de la porte, puis laisse un petit mot et une photo. Touche une maison du village pour ouvrir le cadre photo de cet ami.

      ■ Le village
      • Une place avec une cathédrale au centre, entourée de rues
      • 9 types de maisons (chalet en rondins, boulangerie, moulin, maison en pain d'épices…) dans 4 orientations
      • Les rues apportent une patinoire, la maison du Père Noël, une statue de Rudolph et d'autres lieux
      • À partir de 18 maisons, une aurore boréale apparaît

      ■ Gratuit jusqu'à 6 maisons
      Un village accueille 6 maisons gratuitement. Pour plus d'amis, choisis une rue et ouvre 3 terrains de plus à chaque fois (jusqu'à 60) grâce à un achat intégré. Le village agrandi s'affiche de la même façon sur le web.

      ■ Discret avec les photos
      • Aucune inscription : ni nom, ni e-mail, ni numéro de téléphone
      • Les photos sont stockées en privé et ne s'affichent que via un lien temporaire lorsqu'on touche une maison
      • Les cartes de partage ne contiennent jamais de photos ni de pseudos
      • Les données de localisation (EXIF) sont supprimées à l'envoi
      • Vide ta maison à tout moment ; le créateur du village peut supprimer tout le village
      • Signale une maison inappropriée

      Toute personne disposant du lien peut voir le village : partage-le uniquement avec des personnes de confiance.
  de:
    google_play_locale: de-DE
    app_store_locale: de-DE
    title: "Snow Village: Mit Freunden"
    name: "Snow Village: Mit Freunden"
    subtitle: "Ein Winterdorf mit Freunden"
    short_description: "Lade Freunde per Link ein – jeder baut ein Haus. Antippen öffnet den Fotorahmen."
    keywords: "weihnachten,winter,dorf,freunde,einladen,foto,erinnerungen,feiertage,schnee,gruppe,geschenk"
    promotional_text: "Bau in dieser Weihnachtszeit mit deinen Freunden ein kleines Winterdorf – ein Foto und ein paar Worte pro Haus."
    full_description: |
      Snow Village ist ein kleines Winterdorf, das du gemeinsam mit Freunden baust.

      Erstelle ein Dorf und teile den Link. Jeder Freund öffnet ihn, baut ein Haus auf einem freien Grundstück, wählt Hausart und Türrichtung und hinterlässt eine kurze Nachricht und ein Foto. Tippe im Dorf auf ein Haus, um den Fotorahmen dieses Freundes zu öffnen.

      ■ Das Dorf
      • Der Domplatz in der Mitte, rundherum die Gassen
      • 9 Hausarten – Blockhaus, Bäckerei, Windmühle, Lebkuchenhaus und mehr – in 4 Richtungen
      • In jeder Gasse entsteht etwas Besonderes: eine Eisbahn, das Haus des Weihnachtsmanns, eine Rudolf-Statue und mehr
      • Wohnen mehr als 18 Freunde im Dorf, leuchtet ein Polarlicht am Himmel

      ■ Kostenlos für 6 Häuser
      Ein Dorf bietet kostenlos Platz für 6 Häuser. Für mehr Freunde wählst du eine Gasse und öffnest per In-App-Kauf jeweils 3 weitere Grundstücke (bis zu 60). Das größere Dorf wird im Web genauso angezeigt.

      ■ Fotos bleiben privat
      • Keine Registrierung: kein Name, keine E-Mail-Adresse, keine Telefonnummer
      • Fotos liegen in privatem Speicher und werden nur über einen kurzlebigen Link angezeigt, wenn ein Haus angetippt wird
      • Teilen-Karten enthalten nie Fotos oder Spitznamen
      • Standortdaten (EXIF) werden beim Hochladen entfernt
      • Du kannst dein Haus jederzeit räumen; wer das Dorf erstellt hat, kann das ganze Dorf löschen
      • Unangemessene Häuser kannst du melden

      Jeder mit dem Link kann das Dorf sehen – teile ihn also nur mit Menschen, denen du vertraust.
  pt:
    google_play_locale: pt-BR
    app_store_locale: pt-BR
    title: "Snow Village: Vila com amigos"
    name: "Snow Village: Vila com amigos"
    subtitle: "Uma vila de inverno com amigos"
    short_description: "Convide amigos por link e cada um constrói uma casa. Toque numa para ver a foto."
    keywords: "natal,inverno,vila,amigos,convite,foto,lembranças,festas,neve,grupo,presente,isométrico"
    promotional_text: "Construa uma pequena vila de inverno com seus amigos nestas festas: uma foto e um recado por casa."
    full_description: |
      Snow Village é uma pequena vila de inverno que você constrói com seus amigos.

      Crie uma vila e compartilhe o link. Cada amigo abre o link, constrói uma casa em um terreno vazio, escolhe o estilo e a direção da porta e deixa um recado e uma foto. Toque em uma casa da vila para abrir o porta-retrato desse amigo.

      ■ A vila
      • Uma praça com catedral no centro e ruas ao redor
      • 9 tipos de casa — cabana de madeira, padaria, moinho, casa de gengibre e mais — com a porta em 4 direções
      • Cada rua ganha uma atração, como a pista de gelo, a casa do Papai Noel ou a estátua do Rudolph
      • Com mais de 18 amigos, uma aurora aparece no céu da vila

      ■ Grátis para 6 casas
      Uma vila comporta 6 casas de graça. Para mais amigos, escolha uma rua e abra mais 3 terrenos por vez (até 60) com uma compra no app. A vila maior aparece do mesmo jeito na web.

      ■ Discreto com as fotos
      • Sem cadastro: sem nome, e-mail ou telefone
      • As fotos ficam em armazenamento privado e só aparecem por um link temporário quando alguém toca na casa
      • Os cartões de compartilhamento nunca incluem fotos nem apelidos
      • Os dados de localização (EXIF) são removidos no envio
      • Desocupe sua casa quando quiser; quem criou a vila pode excluir a vila inteira
      • Casas com conteúdo impróprio podem ser denunciadas

      Qualquer pessoa com o link pode ver a vila, então compartilhe só com quem você confia.
  ru:
    google_play_locale: ru-RU
    app_store_locale: ru
    title: "Snow Village: С друзьями"
    name: "Snow Village: С друзьями"
    subtitle: "Зимняя деревня с друзьями"
    short_description: "Позови друзей по ссылке — каждый построит дом. Нажми на дом и увидишь фото."
    keywords: "рождество,новый год,зима,деревня,друзья,приглашение,фото,воспоминания,праздники,снег,подарок"
    promotional_text: "Построй с друзьями маленькую зимнюю деревню в эти праздники: в каждом доме — одно фото и пара слов."
    full_description: |
      Snow Village — маленькая зимняя деревня, которую строишь вместе с друзьями.

      Создай деревню и поделись ссылкой. Каждый друг открывает её, строит дом на свободном участке, выбирает его вид и направление двери, оставляет короткое сообщение и одно фото. Нажми на дом в деревне, чтобы открыть фоторамку этого друга.

      ■ Деревня
      • В центре — площадь с собором, вокруг — переулки
      • 9 видов домов — бревенчатый домик, пекарня, мельница, пряничный домик и другие, дверь в любую из 4 сторон
      • С переулками появляются каток, дом Санты, статуя Рудольфа и другие достопримечательности
      • Когда домов 18 или больше, в небе появляется северное сияние

      ■ 6 домов бесплатно
      В деревне можно бесплатно построить 6 домов. Если друзей больше, выбери переулок и открой ещё 3 участка за раз (до 60) покупкой в приложении. Расширенная деревня выглядит так же и в веб-версии.

      ■ Бережно к фото
      • Без регистрации: не нужны ни имя, ни e-mail, ни номер телефона
      • Фото хранятся в закрытом хранилище и показываются только по временной ссылке, когда нажимают на дом
      • В открытки для друзей не попадают ни фото, ни никнеймы
      • Данные о местоположении (EXIF) удаляются при загрузке
      • Свой дом можно освободить в любой момент, а создатель деревни может удалить её целиком
      • На неподходящий дом можно пожаловаться

      Деревню может увидеть любой, у кого есть ссылка, поэтому делись ею только с теми, кому доверяешь.
